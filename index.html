<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a">
  <title>Escáner UDI IOL</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#182635;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}header{background:#10243a;color:#fff;padding:18px 16px;padding-top:calc(18px + env(safe-area-inset-top))}header h1{font-size:20px;margin:0}header p{margin:5px 0 0;color:#cfdae4;font-size:13px}.wrap{max-width:650px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid #d8e1e9;border-radius:14px;padding:17px;box-shadow:0 2px 8px #1826350a}p{margin:5px 0 13px;color:#526373}.camera{display:block;width:100%;max-height:68vh;object-fit:cover;background:#101010;border-radius:11px;margin:14px 0}.status{background:#eef4f9;border-radius:9px;padding:11px 12px;color:#31495e;font-size:14px;overflow-wrap:anywhere}.status.error{background:#fff0f0;color:#923232}.status.good{background:#e8f6ed;color:#17633d}button{width:100%;margin:8px 0 0;border:0;border-radius:10px;background:#1769aa;color:#fff;font:inherit;font-weight:700;padding:14px;min-height:48px;cursor:pointer}.secondary{background:#e9eff4;color:#24394b}.hidden{display:none!important}small{display:block;color:#687887;margin-top:12px}
  </style>
</head>
<body>
<header><h1>Escáner UDI IOL</h1><p>Apunta al código de la caja. El resultado se enviará a la app de informes.</p></header>
<main class="wrap"><section class="card">
  <div id="status" class="status">Toca el botón para iniciar la cámara y permitir el acceso en este sitio.</div>
  <video id="video" class="camera hidden" playsinline muted></video>
  <button id="start" onclick="startCamera()">Iniciar cámara</button>
  <button id="stop" class="secondary hidden" onclick="stopCamera()">Cerrar cámara</button>
  <small>La cámara se usa en esta pestaña para leer el código. El escáner solo devuelve el texto UDI a la app que abrió esta página.</small>
</section></main>
<script>
let stream=null,detector=null,timer=null,busy=false;
const statusBox=document.getElementById('status'),video=document.getElementById('video');
function setStatus(text,type=''){statusBox.textContent=text;statusBox.className='status '+type}
async function startCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('Este navegador no ofrece acceso a cámara desde esta página. Usa “Fotografiar código UDI” en la app.','error');return}
  if(!('BarcodeDetector'in window)||!BarcodeDetector.getSupportedFormats){setStatus('Este navegador no puede leer códigos en vivo. Cierra esta pestaña y usa “Fotografiar código UDI” en la app.','error');return}
  try{
    const supported=await BarcodeDetector.getSupportedFormats();
    const formats=['data_matrix','code_128','ean_13','ean_8','qr_code','upc_a','upc_e'].filter(x=>supported.includes(x));
    if(!formats.length){setStatus('El navegador no reconoce formatos UDI compatibles. Usa la opción de foto en la app.','error');return}
    detector=new BarcodeDetector({formats});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject=stream;video.classList.remove('hidden');await video.play();
    document.getElementById('start').classList.add('hidden');document.getElementById('stop').classList.remove('hidden');setStatus('Cámara activa. Centra el código y mantén el teléfono quieto.');
    timer=setInterval(scanFrame,350);
  }catch(e){stopCamera(false);let m=e&&e.name==='NotAllowedError'?'Permiso denegado. En Chrome, permite la cámara para esta dirección y vuelve a intentarlo.':e&&e.name==='NotFoundError'?'No se encontró una cámara disponible.':'No se pudo iniciar la cámara ('+(e&&e.name||'error')+'). Revisa el permiso del sitio e inténtalo otra vez.';setStatus(m,'error')}
}
async function scanFrame(){if(!detector||!video||video.readyState<2||busy)return;busy=true;try{const codes=await detector.detect(video);if(codes.length){const raw=codes[0].rawValue||'';if(raw){setStatus('Código detectado. Volviendo a la app…','good');stopCamera();sendResult(raw)}}}catch(e){}finally{busy=false}}
function sendResult(raw){if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'IOL_UDI',rawValue:raw},'*');setTimeout(()=>window.close(),500)}else{setStatus('Código: '+raw+' · No se pudo devolver automáticamente. Cópialo y pégalo en la app.','good');const b=document.createElement('button');b.textContent='Copiar UDI';b.onclick=async()=>{try{await navigator.clipboard.writeText(raw);b.textContent='Copiado'}catch(e){}};document.querySelector('.card').appendChild(b)}}
function stopCamera(reset=true){if(timer)clearInterval(timer);timer=null;detector=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;video.classList.add('hidden');document.getElementById('stop').classList.add('hidden');if(reset)document.getElementById('start').classList.remove('hidden')}
window.addEventListener('pagehide',()=>stopCamera(false));
</script>
</body>
</html>
